<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Leadership – SchoolShield</title><link rel='stylesheet' href='style.css'></head><body><div id='app'></div><script src='shared.js'></script><script>
layout('Leadership', `<h1>Leadership Dashboard</h1><div class='stats'>${[['Visitors',state.visitors.length],['Inside',state.visitors.filter(v=>v.status==='Inside').length],['Incidents',state.incidents.length],['Open',state.incidents.filter(i=>i.status==='Open').length],['Alerts',state.notifications.length],['Security',2]].map(x=>`<div class='card'><div class='muted'>${x[0]}</div><div class='num'>${x[1]}</div></div>`).join('')}</div><div class='card section-card'><h2>Live Visitor Monitoring</h2><div class='table-wrap'>${visitorTable()}</div></div>`);
</script></body></html>
